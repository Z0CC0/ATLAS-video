<text x="44" y="94" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f5f5f7" font-weight="600">You ask</text><text x="190" y="94" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e73" text-anchor="end">1</text>
<text x="44" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#98989d" >in plain words, in</text>
<text x="44" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#98989d" >the chat:</text>
<text x="44" y="168" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f5f5f7" >“a 30-second video</text>
<text x="44" y="186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f5f5f7" >that explains this</text>
<text x="44" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f5f5f7" >project”</text>
<text x="252" y="94" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f5f5f7" font-weight="600">Commands drive</text>
<text x="252" y="113" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f5f5f7" font-weight="600">the editor</text><text x="398" y="94" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e73" text-anchor="end">2</text>
<rect x="248.5" y="128.5" width="153" height="39" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.22"/><text x="260" y="145" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f5f5f7" >without a window</text><text x="260" y="161" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e73" >the default</text>
<rect x="248.5" y="176.5" width="153" height="39" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.22"/><text x="260" y="193" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f5f5f7" >in the window</text><text x="260" y="209" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6e6e73" >you watch every step</text>
<text x="460" y="94" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f5f5f7" font-weight="600">You leave notes</text><text x="606" y="94" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e73" text-anchor="end">3</text>
<text x="460" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#98989d" >a marker with a</text>
<text x="460" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#98989d" >comment, on either</text>
<text x="460" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#98989d" >timeline, while it</text>
<text x="460" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#98989d" >works or after</text>
<text x="668" y="94" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#f5f5f7" font-weight="600">You get</text><text x="814" y="94" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6e6e73" text-anchor="end">4</text>
<text x="668" y="132" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f5f5f7" >the film</text>
<text x="668" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f5f5f7" >an effects project</text>
<line x1="668" y1="142" x2="814" y2="142" stroke="#ffffff" stroke-opacity="0.16"/>
<text x="668" y="188" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f5f5f7" >a montage project</text>
<line x1="668" y1="170" x2="814" y2="170" stroke="#ffffff" stroke-opacity="0.16"/>
<text x="668" y="210" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e6e73" >both open in the window</text>
