<svg xmlns="http://www.w3.org/2000/svg" width="860" height="312" viewBox="0 0 860 312" role="img" aria-label="How atlas media works: you ask, commands drive THE STUDIO without a window or in it while you watch, you leave notes on the timeline, the notes are resolved, and you get the film and two project files">
<title>How atlas media works: you ask, commands drive THE STUDIO without a window or in it while you watch, you leave notes on the timeline, the notes are resolved, and you get the film and two project files</title>
